name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project ZIP & Generate Keystore
      run: |
        unzip -o qaiser-mechanical.zip
        
        # Match Package Name with Firebase
        if [ -f "app/google-services.json" ]; then
          PKG=$(grep -o '"package_name": "[^"]*' app/google-services.json | head -n 1 | cut -d'"' -f4)
          if [ -n "$PKG" ]; then
            sed -i "s/applicationId = .*/applicationId = \"$PKG\"/g" app/build.gradle.kts || true
          fi
        fi

        # Generate debug keystore
        mkdir -p ~/.android
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        cp debug.keystore app/debug.keystore || true
        cp debug.keystore ~/.android/debug.keystore || true

        chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x validateSigningDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qaiser-mechanical-apk
        path: app/build/outputs/apk/debug/*.apk
        
