name: Build Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP & Inject Dedicated Admin Dashboard
        run: |
          mkdir project_files
          unzip -o *.zip -d project_files/
          
          # Find project root
          PROJ_ROOT=$(find project_files -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_ROOT" ]; then
            PROJ_ROOT="project_files"
          fi
          echo "PROJ_ROOT=$PROJ_ROOT" >> $GITHUB_ENV

          # Inject dedicated Admin Panel in Profile / Screens
          find "$PROJ_ROOT" -type f -name "*.kt" | while read -r file; do
            sed -i 's/toseef446@gmail.com/www.toseef446@gmail.com/gI' "$file"
          done

      - name: Grant Execute Permission for Gradle
        run: |
          cd $PROJ_ROOT
          chmod +x gradlew || gradle wrapper

      - name: Build Release/Debug APK
        run: |
          cd $PROJ_ROOT
          ./gradlew assembleDebug --stacktrace

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: qaiser-mechanical-admin-exclusive-apk
          path: ${{ env.PROJ_ROOT }}/app/build/outputs/apk/debug/*.apk
          
